spring.datasource.url=jdbc:mysql://localhost:3306/muzayede-dev2?createDatabaseIfNotExist=true&useUnicode=true&useLegacyDatetimeCode
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

socket-server.port=8085
socket-server.host=0.0.0.0


spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


cloudinary.cloudname =${CLOUDINARY_CLOUD_NAME:}
cloudinary.apikey =${CLOUDINARY_API_KEY:}
cloudinary.apisecret =${CLOUDINARY_API_SECRET:}

spring.mail.password=${MAIL_PASSWORD:}
spring.mail.host=smtp.gmail.com
spring.mail.username=${MAIL_USERNAME:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.port=587